services:
  - type: web
    name: medicalcare-ai-proxy
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false   # set manually in Render dashboard
      - key: ALLOWED_ORIGIN
        sync: false   # set to your Vercel URL, e.g. https://your-app.vercel.app
      - key: OPENAI_MODEL
        value: gpt-4o-mini
